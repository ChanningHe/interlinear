name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      # Store zips plus the source zip AMO reviewers rebuild from.
      - run: scripts/package.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist/packages
        run: |
          gh release create "$GITHUB_REF_NAME" interlinear-*.zip SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
